name: Winception HostTools release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winception-release-candidate
  cancel-in-progress: false

jobs:
  bundle-and-verify:
    name: Clean checkout, zero-preload bundle and fresh install
    runs-on: [self-hosted, windows, winception-lab]
    timeout-minutes: 60
    env:
      NPM_CONFIG_CACHE: ${{ runner.temp }}\winception-npm-cache
    steps:
      - name: Checkout release candidate source
        uses: actions/checkout@v4

      - name: Use Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install source dependencies and run gates
        shell: powershell
        run: |
          npm ci --no-audit --no-fund
          $jsFiles = @(git ls-files '*.js')
          foreach ($file in $jsFiles) { node --check -- $file; if ($LASTEXITCODE -ne 0) { throw "node --check failed: $file" } }
          $psFiles = @(git ls-files '*.ps1')
          foreach ($file in $psFiles) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $env:GITHUB_WORKSPACE $file), [ref] $tokens, [ref] $errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell parser failed: $file" }
          }
          git diff --check
          npm run check
          npm test
          npm run smoke

      - name: Export Release HostTools bundle
        shell: powershell
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP ('winception-release-{0}' -f $env:GITHUB_SHA)
          New-Item -ItemType Directory -Path $bundleRoot -Force | Out-Null
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'tools\Export-HostToolsBundle.ps1') -SourceRoot $env:GITHUB_WORKSPACE -OutputRoot $bundleRoot -Channel Release -Commit $env:GITHUB_SHA -CreateZip -Force | Out-Null
          "WINCEPTION_BUNDLE_ROOT=$bundleRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify manifest, allowlist and Release zero-preload policy
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath $env:WINCEPTION_BUNDLE_ROOT -Filter 'winception-hosttools-release-*.zip' -File | Select-Object -First 1
          if (-not $zip) { throw 'Release HostTools ZIP was not created.' }
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'tools\Verify-HostToolsBundle.ps1') -BundleRoot $env:WINCEPTION_BUNDLE_ROOT -Channel Release -ZipPath $zip.FullName -ExpectedCommit $env:GITHUB_SHA -ExpectedVersion ((Get-Content (Join-Path $env:GITHUB_WORKSPACE 'package.json') -Raw | ConvertFrom-Json).version)
          $hash = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$($zip.Name)" | Set-Content -LiteralPath (Join-Path $env:WINCEPTION_BUNDLE_ROOT ($zip.Name + '.sha256')) -Encoding ascii

      - name: Fresh extraction and State initialization check
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath $env:WINCEPTION_BUNDLE_ROOT -Filter 'winception-hosttools-release-*.zip' -File | Select-Object -First 1
          $extractRoot = Join-Path $env:RUNNER_TEMP ('winception-release-extracted-{0}' -f $env:GITHUB_RUN_ID)
          $freshApp = Join-Path $env:RUNNER_TEMP ('winception-release-app-{0}' -f $env:GITHUB_RUN_ID)
          $freshState = Join-Path $env:RUNNER_TEMP ('winception-release-state-{0}' -f $env:GITHUB_RUN_ID)
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $extractRoot -Force
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $env:GITHUB_WORKSPACE 'tools\Verify-HostToolsBundle.ps1') -BundleRoot $extractRoot -Channel Release
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File (Join-Path $extractRoot 'tools\Install-HostManagementBundle.ps1') -SourceRoot $extractRoot -AppRoot $freshApp -StateRoot $freshState -Channel Release -Force
          $config = Get-Content -LiteralPath (Join-Path $freshState 'config\osdcloud-console.json') -Raw | ConvertFrom-Json
          if ($config.product.channel -ne 'release' -or $config.product.dataPolicy -ne 'zero-preload' -or $config.initialization.status -ne 'unconfigured') { throw 'Fresh Release State is not unconfigured zero-preload state.' }
          if ($null -ne $config.deploymentProfiles.activeProfile -or $null -ne $config.osImage.activeImage) { throw 'Fresh Release State contains active deployment selection.' }
          if (@(Get-ChildItem -LiteralPath (Join-Path $freshState 'config\deployment-profiles') -Filter '*.json' -File -ErrorAction SilentlyContinue).Count -gt 0) { throw 'Fresh Release State contains deployment profiles.' }
          if (Test-Path -LiteralPath (Join-Path $freshApp 'fixtures\development')) { throw 'Fresh Release App contains development fixtures.' }
          if (Test-Path -LiteralPath (Join-Path $freshApp 'tools\Seed-DevelopmentFixture.ps1')) { throw 'Fresh Release App contains the Development seed command.' }

      - name: Classify signing status without claiming production release
        shell: powershell
        run: |
          $zip = Get-ChildItem -LiteralPath $env:WINCEPTION_BUNDLE_ROOT -Filter 'winception-hosttools-release-*.zip' -File | Select-Object -First 1
          $metadata = [ordered]@{
            schemaVersion = 1
            releaseClass = 'unsigned-rc'
            productionEligible = $false
            reason = 'No approved Authenticode signing certificate and policy were supplied to this workflow.'
            zip = $zip.Name
            sha256 = (Get-FileHash -LiteralPath $zip.FullName -Algorithm SHA256).Hash
          }
          $metadata | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath (Join-Path $env:WINCEPTION_BUNDLE_ROOT 'release-candidate-metadata.json') -Encoding utf8
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value "## Winception release candidate`n`n- Bundle: unsigned RC only`n- Production GitHub Release: not created`n- Tag/push/history mutation: none"

      - name: Upload unsigned RC artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: winception-hosttools-unsigned-rc-${{ github.sha }}
          path: |
            ${{ runner.temp }}\winception-release-${{ github.sha }}\winception-hosttools-release-*.zip
            ${{ runner.temp }}\winception-release-${{ github.sha }}\winception-hosttools-release-*.zip.sha256
            ${{ runner.temp }}\winception-release-${{ github.sha }}\HostTools\bundle-manifest.json
            ${{ runner.temp }}\winception-release-${{ github.sha }}\release-candidate-metadata.json
          if-no-files-found: warn
          retention-days: 30
