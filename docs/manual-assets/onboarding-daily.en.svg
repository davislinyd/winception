<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="title"><title id="title">Daily deployment: follow the next action</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="515" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">Daily deployment: follow the next action</text><rect x="28" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="116" font-size="21" fill="#1f6f78">1. Review this deployment</text><text x="46" y="149" font-size="17" fill="#28231d">Image, profile, network</text><rect x="356" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="116" font-size="21" fill="#1f6f78">2. Check and start</text><text x="374" y="149" font-size="17" fill="#28231d">Preflight + DHCP source</text><rect x="684" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="702" y="116" font-size="21" fill="#1f6f78">3. Connect / PXE boot</text><text x="702" y="149" font-size="17" fill="#28231d">Match current boot mode</text><rect x="28" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="243" font-size="21" fill="#1f6f78">4. Pair when required</text><text x="46" y="276" font-size="17" fill="#28231d">WinPE ↔ Console code</text><rect x="356" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="243" font-size="21" fill="#1f6f78">5. Track client progress</text><text x="374" y="276" font-size="17" fill="#28231d">Activity and failures</text><rect x="684" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="702" y="243" font-size="21" fill="#1f6f78">6. Confirm completion</text><text x="702" y="276" font-size="17" fill="#28231d">windows-desktop-ready</text><rect x="28" y="338" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="370" font-size="21" fill="#1f6f78">7. Stop deployment services</text><text x="46" y="403" font-size="17" fill="#28231d">All done; keep NAT</text><text x="28" y="485" font-size="17" fill="#28231d">New site: keep images/profiles; recheck wiring, NICs, IP, gateway and DNS, then sync.</text></g></svg>
