<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">③ Client 接到筆電 + NAT</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="390" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">③ Client 接到筆電 + NAT</text><rect x="28" y="88" width="200" height="122" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="120" font-size="21" fill="#1f6f78">Internet / Router</text><text x="46" y="153" font-size="17" fill="#28231d">上游 DHCP 維持原樣</text><text x="46" y="178" font-size="17" fill="#28231d">Wi-Fi 或有線上網</text><rect x="298" y="88" width="306" height="160" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="316" y="120" font-size="21" fill="#1f6f78">Winception laptop</text><text x="316" y="153" font-size="17" fill="#28231d">WAN：上網介面</text><text x="316" y="178" font-size="17" fill="#28231d">NAT → client gateway</text><text x="316" y="203" font-size="17" fill="#28231d">PXE：Ethernet / USB 網卡</text><text x="316" y="228" font-size="17" fill="#28231d">DHCP + PXE + SMB</text><rect x="674" y="88" width="298" height="122" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="692" y="120" font-size="21" fill="#1f6f78">一台 client / 多台 + 交換器</text><text x="692" y="153" font-size="17" fill="#28231d">Ethernet 網路線接筆電 PXE</text><text x="692" y="178" font-size="17" fill="#28231d">獨立 client subnet</text><path d="M228 143H298" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><path d="M604 143H674" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><text x="28" y="285" font-size="20" fill="#28231d">兩張不同的實體網卡；Client 直接接線或透過交換器。</text><text x="28" y="322" font-size="18" fill="#28231d">Client gateway = 子網第一個可用 IP；DNS 沿用 WAN，子網需避免 VPN／LAN 重疊。</text><text x="28" y="359" font-size="18" fill="#28231d">停止部署服務仍保留 NAT 上網；ICS／其他 NAT 衝突交由擁有者處理。</text></g></svg>
