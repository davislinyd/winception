<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">3. Clients connected to laptop + NAT</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="390" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">3. Clients connected to laptop + NAT</text><rect x="28" y="88" width="200" height="122" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="120" font-size="21" fill="#1f6f78">Internet / Router</text><text x="46" y="153" font-size="17" fill="#28231d">Keep upstream DHCP</text><text x="46" y="178" font-size="17" fill="#28231d">Wi-Fi or wired uplink</text><rect x="298" y="88" width="306" height="160" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="316" y="120" font-size="21" fill="#1f6f78">Winception laptop</text><text x="316" y="153" font-size="17" fill="#28231d">WAN: Internet adapter</text><text x="316" y="178" font-size="17" fill="#28231d">NAT → client gateway</text><text x="316" y="203" font-size="17" fill="#28231d">PXE: Ethernet / USB NIC</text><text x="316" y="228" font-size="17" fill="#28231d">DHCP + PXE + SMB</text><rect x="674" y="88" width="298" height="122" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="692" y="120" font-size="21" fill="#1f6f78">One client / switch + clients</text><text x="692" y="153" font-size="17" fill="#28231d">Ethernet to laptop PXE</text><text x="692" y="178" font-size="17" fill="#28231d">Separate client subnet</text><path d="M228 143H298" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><path d="M604 143H674" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><text x="28" y="285" font-size="20" fill="#28231d">Two distinct physical adapters. Connect directly or through a switch.</text><text x="28" y="322" font-size="18" fill="#28231d">Client gateway = first usable IP; use WAN DNS. Avoid VPN/LAN subnet overlap.</text><text x="28" y="359" font-size="18" fill="#28231d">Stopping deployment services keeps NAT. Resolve foreign ICS/NAT with its owner.</text></g></svg>
