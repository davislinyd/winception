<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" role="img" aria-labelledby="title"><title id="title">首次設定：一次完成一個步驟</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="386" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">首次設定：一次完成一個步驟</text><rect x="28" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="116" font-size="21" fill="#1f6f78">1. 主機與帳號</text><text x="46" y="149" font-size="17" fill="#28231d">部署資料夾、Windows 帳號</text><rect x="356" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="116" font-size="21" fill="#1f6f78">2. 選擇接線方式</text><text x="374" y="149" font-size="17" fill="#28231d">既有 DHCP / 自管 / NAT</text><rect x="684" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="702" y="116" font-size="21" fill="#1f6f78">3. 部署檔案與網路</text><text x="702" y="149" font-size="17" fill="#28231d">準備 WinPE、同步端點</text><rect x="28" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="243" font-size="21" fill="#1f6f78">4. Windows 與部署設定</text><text x="46" y="276" font-size="17" fill="#28231d">快取映像、發布本次內容</text><rect x="356" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="243" font-size="21" fill="#1f6f78">5. 檢查並开始部署</text><text x="374" y="276" font-size="17" fill="#28231d">Preflight → 服務 → client</text><text x="28" y="356" font-size="17" fill="#28231d">更換場地：保留映像與設定，重新確認接線、介面、IP、gateway、DNS，再同步端點。</text></g></svg>
