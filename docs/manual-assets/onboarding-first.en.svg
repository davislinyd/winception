<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 386" role="img" aria-labelledby="title"><title id="title">First setup: one step at a time</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="386" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">First setup: one step at a time</text><rect x="28" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="116" font-size="21" fill="#1f6f78">1. Host and credentials</text><text x="46" y="149" font-size="17" fill="#28231d">Runtime folder, Windows user</text><rect x="356" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="116" font-size="21" fill="#1f6f78">2. Choose wiring</text><text x="374" y="149" font-size="17" fill="#28231d">Existing DHCP / server / NAT</text><rect x="684" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="702" y="116" font-size="21" fill="#1f6f78">3. Files and network</text><text x="702" y="149" font-size="17" fill="#28231d">Prepare WinPE, sync endpoint</text><rect x="28" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="243" font-size="21" fill="#1f6f78">4. Windows and profile</text><text x="46" y="276" font-size="17" fill="#28231d">Cache image, publish profile</text><rect x="356" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="243" font-size="21" fill="#1f6f78">5. Check and deploy</text><text x="374" y="276" font-size="17" fill="#28231d">Preflight → services → client</text><text x="28" y="356" font-size="17" fill="#28231d">New site: keep images/profiles; recheck wiring, NICs, IP, gateway and DNS, then sync.</text></g></svg>
