<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title"><title id="title">② 既有 LAN + Winception DHCP</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="390" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">② 既有 LAN + Winception DHCP</text><rect x="28" y="90" width="250" height="135" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="122" font-size="21" fill="#1f6f78">既有 Router / Gateway</text><text x="46" y="155" font-size="17" fill="#28231d">現場 gateway + DNS</text><text x="46" y="180" font-size="17" fill="#28231d">此網段原 DHCP 已停用</text><rect x="360" y="90" width="230" height="135" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="378" y="122" font-size="21" fill="#1f6f78">既有 LAN / 交換器</text><text x="378" y="155" font-size="17" fill="#28231d">同一 client subnet</text><text x="378" y="180" font-size="17" fill="#28231d">原有 gateway 上網</text><rect x="672" y="74" width="300" height="112" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="690" y="106" font-size="21" fill="#1f6f78">Winception laptop</text><text x="690" y="139" font-size="17" fill="#28231d">LAN 服務介面有 IPv4</text><text x="690" y="164" font-size="17" fill="#28231d">DHCP Server + PXE + SMB</text><rect x="672" y="219" width="300" height="92" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="690" y="251" font-size="21" fill="#1f6f78">目標電腦 Clients</text><text x="690" y="284" font-size="17" fill="#28231d">UEFI IPv4 PXE 開機</text><path d="M278 150H360" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 131H672" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><path d="M590 177H625V267H672" fill="none" stroke="#1f6f78" stroke-width="3" marker-end="url(#arrow)"/><text x="28" y="354" font-size="18" fill="#28231d">確認沒有其他 DHCP server；核對位址池、既有 gateway 與 DNS，再啟動服務。</text></g></svg>
