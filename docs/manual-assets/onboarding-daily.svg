<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="title"><title id="title">日常部署：照首頁的下一步操作</title><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#1f6f78"/></marker></defs><rect width="1000" height="515" rx="16" fill="#f7f3eb"/><g font-family="Segoe UI, Noto Sans TC, sans-serif"><text x="28" y="43" font-size="26" fill="#28231d">日常部署：照首頁的下一步操作</text><rect x="28" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="116" font-size="21" fill="#1f6f78">1. 核對本次內容</text><text x="46" y="149" font-size="17" fill="#28231d">映像、設定、網路</text><rect x="356" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="116" font-size="21" fill="#1f6f78">2. 檢查並啟動</text><text x="374" y="149" font-size="17" fill="#28231d">Preflight + DHCP 來源</text><rect x="684" y="84" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="702" y="116" font-size="21" fill="#1f6f78">3. 接線／PXE 開機</text><text x="702" y="149" font-size="17" fill="#28231d">依當前 boot mode</text><rect x="28" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="243" font-size="21" fill="#1f6f78">4. 必要時核對配對</text><text x="46" y="276" font-size="17" fill="#28231d">WinPE ↔ Console 配對碼</text><rect x="356" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="374" y="243" font-size="21" fill="#1f6f78">5. 查看電腦進度</text><text x="374" y="276" font-size="17" fill="#28231d">部署活動與失敗原因</text><rect x="684" y="211" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="702" y="243" font-size="21" fill="#1f6f78">6. 確認部署完成</text><text x="702" y="276" font-size="17" fill="#28231d">windows-desktop-ready</text><rect x="28" y="338" width="300" height="102" rx="14" fill="#fffaf1" stroke="#1f6f78" stroke-width="2"/><text x="46" y="370" font-size="21" fill="#1f6f78">7. 停止部署服務</text><text x="46" y="403" font-size="17" fill="#28231d">全部完成；保留 NAT</text><text x="28" y="485" font-size="17" fill="#28231d">更換場地：保留映像與設定，重新確認接線、介面、IP、gateway、DNS，再同步端點。</text></g></svg>
